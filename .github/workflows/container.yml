name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/proton-bridge

jobs:
  build-scan:
    name: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Docker configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          pull: true
          push: false
          tags: proton-bridge:ci

      - name: Verify non-root runtime
        run: |
          uid="$(docker run --rm --entrypoint sh proton-bridge:ci -c 'id -u')"
          test "${uid}" != "0"
          echo "Container default UID: ${uid}"

      - name: Smoke test Bridge binary
        run: docker run --rm proton-bridge:ci version

      - name: Report image size
        run: |
          bytes="$(docker image inspect proton-bridge:ci --format '{{.Size}}')"
          mib="$((bytes / 1024 / 1024))"
          echo "Runtime image size: ${mib} MiB (${bytes} bytes)"
          docker history --format 'table {{.Size}}\t{{.CreatedBy}}' proton-bridge:ci

      - name: Scan runtime image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: proton-bridge:ci
          format: json
          output: trivy-results.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Gate runtime vulnerabilities
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("trivy-results.json", encoding="utf-8") as fh:
              report = json.load(fh)

          findings = []
          for result in report.get("Results") or []:
              target = result.get("Target", "?")
              for vuln in result.get("Vulnerabilities") or []:
                  severity = vuln.get("Severity", "UNKNOWN")
                  fixed = vuln.get("FixedVersion") or ""
                  if severity not in {"HIGH", "CRITICAL"} or not fixed:
                      continue
                  findings.append((
                      severity,
                      target,
                      vuln.get("PkgName", "?"),
                      vuln.get("VulnerabilityID", "?"),
                      vuln.get("InstalledVersion", "?"),
                      fixed,
                  ))

          if not findings:
              print("No fixable HIGH/CRITICAL runtime vulnerabilities found.")
              raise SystemExit(0)

          print("Fixable HIGH/CRITICAL runtime vulnerabilities:")
          print("severity\ttarget\tpackage\tcve\tinstalled\tfixed")
          for row in sorted(findings):
              print("\t".join(row))
          print(f"Total: {len(findings)}", file=sys.stderr)
          raise SystemExit(1)
          PY

  publish:
    name: publish
    if: github.event_name == 'push'
    needs: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "${IMAGE}:latest"
            fi
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "${IMAGE}:${GITHUB_REF_NAME}"
            fi
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
